<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="560" viewBox="0 0 1760 560" font-family="sans-serif"><rect width="1760" height="560" fill="#0e141c"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8cc"/></marker></defs><text x="880.0" y="40" font-size="24" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="middle">Nunchikochi — agentic vision loop (simplified)</text><rect x="40" y="70" width="360" height="182" rx="12" ry="12" fill="#161f2b" stroke="#2a3850" stroke-width="1" opacity="1.0"/><text x="58" y="96" font-size="16" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Legend</text><rect x="58" y="111" width="30" height="22" rx="6" ry="6" fill="#122543" stroke="#2f6fe0" stroke-width="2" opacity="1.0"/><text x="100" y="122" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Vision (OpenCV 5)</text><rect x="58" y="137" width="30" height="22" rx="6" ry="6" fill="#241a4d" stroke="#7c5cff" stroke-width="2" opacity="1.0"/><text x="100" y="148" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Agent decision</text><rect x="58" y="163" width="30" height="22" rx="6" ry="6" fill="#3a2912" stroke="#e08a2f" stroke-width="2" opacity="1.0"/><text x="100" y="174" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Human-in-the-loop</text><rect x="58" y="189" width="30" height="22" rx="6" ry="6" fill="#113224" stroke="#2fa36b" stroke-width="2" opacity="1.0"/><text x="100" y="200" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Safety guardrail</text><rect x="58" y="215" width="30" height="22" rx="6" ry="6" fill="#361713" stroke="#d2443a" stroke-width="2" stroke-dasharray="6 5" opacity="1.0"/><text x="100" y="226" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="start" dominant-baseline="middle">Failure / fallback (dashed)</text><rect x="120" y="266" width="220" height="68" rx="14" ry="14" fill="#122543" stroke="#2f6fe0" stroke-width="2" opacity="1.0"/><text x="230.0" y="291.0" font-size="15" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">frame → OpenCV 5</text><text x="230.0" y="309.0" font-size="15" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">quality + confidence</text><polygon points="510,252.0 620.0,300 510,348.0 400.0,300" fill="#241a4d" stroke="#7c5cff" stroke-width="2"/><text x="510" y="284.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">uncertain?</text><text x="510" y="300.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">(low quality or</text><text x="510" y="316.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">low confidence)</text><rect x="690" y="260" width="240" height="80" rx="14" ry="14" fill="#122543" stroke="#2f6fe0" stroke-width="2" opacity="1.0"/><text x="810.0" y="282.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">second_look</text><text x="810.0" y="300.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">(enhance / zoom / strict)</text><text x="810.0" y="318.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">re-analyse</text><polygon points="1120,252.0 1230.0,300 1120,348.0 1010.0,300" fill="#241a4d" stroke="#7c5cff" stroke-width="2"/><text x="1120" y="300.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">resolved?</text><rect x="1380" y="210" width="240" height="64" rx="14" ry="14" fill="#241a4d" stroke="#7c5cff" stroke-width="2" opacity="1.0"/><text x="1500.0" y="233.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">act quietly</text><text x="1500.0" y="251.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">(none / nudge / suppress)</text><rect x="1380" y="324" width="240" height="64" rx="14" ry="14" fill="#3a2912" stroke="#e08a2f" stroke-width="2" opacity="1.0"/><text x="1500.0" y="347.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">ask the human</text><text x="1500.0" y="365.0" font-size="14" fill="#e8eef6" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">yes / no</text><path d="M 340 300 L 400 300" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 620 300 L 690 300" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="639.5" y="275" width="31" height="22" rx="6" fill="#0e141c" stroke="#2a3850" stroke-width="1"/><text x="655.0" y="286" font-size="13" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">yes</text><circle cx="810" cy="260" r="15" fill="#2f6fe0" stroke="#e8eef6" stroke-width="2"/><text x="810" y="261" font-size="16" fill="#ffffff" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="middle">1</text><path d="M 930 300 L 1010 300" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1230 300 L 1380 242" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1244.0" y="231" width="122" height="22" rx="6" fill="#0e141c" stroke="#2a3850" stroke-width="1"/><text x="1305.0" y="242" font-size="13" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">resolved → quiet</text><path d="M 1230 300 L 1380 356" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1207.5" y="319" width="115" height="22" rx="6" fill="#0e141c" stroke="#2a3850" stroke-width="1"/><text x="1265.0" y="330" font-size="13" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">unchanged → ask</text><circle cx="1358" cy="356" r="15" fill="#e08a2f" stroke="#e8eef6" stroke-width="2"/><text x="1358" y="357" font-size="16" fill="#ffffff" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="middle">3</text><path d="M 510 252 C 510 150, 1500 150, 1500 210" fill="none" stroke="#a9b8cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="937.0" y="139" width="136" height="22" rx="6" fill="#0e141c" stroke="#2a3850" stroke-width="1"/><text x="1005.0" y="150" font-size="13" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">no (normal) → none</text><path d="M 1500 388 C 1500 500, 510 500, 510 348" fill="none" stroke="#7c5cff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="863.5" y="489" width="283" height="22" rx="6" fill="#0e141c" stroke="#2a3850" stroke-width="1"/><text x="1005.0" y="500" font-size="13" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">human &#x27;no&#x27; → raise threshold (persists)</text><circle cx="1516" cy="388" r="15" fill="#7c5cff" stroke="#e8eef6" stroke-width="2"/><text x="1516" y="389" font-size="16" fill="#ffffff" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="middle">4</text><text x="880.0" y="534" font-size="14" fill="#a9b8cc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">Vision result changes the decision: re-look before asking (①), human in control (③), learned threshold (④).</text></svg>